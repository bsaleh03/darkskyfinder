# Curated facts for SE Michigan spots, keyed by Overture GERS ID (release 2026-09-23.1).
# Find IDs with: python -m darksky_pipeline.probe find --metro se_mi --release <R> --name "<name>"
# Keys: id, label, verified, dark_sky_place, access_note, unavailable, unavailable_reason, hidden, recommended, sources
#
# Dark sky designations: Michigan Public Act 57 of 1993 (Lake Hudson) and 2012 amendments
# (Port Crescent, portion north/west of the Pinnebog River). No official source found yet
# for 24h / after-dark access, so nothing is marked verified.
spots:
- id: a3cdd909-ea67-4bee-876a-2b0534f77960
  label: Lake Hudson State Park
  dark_sky_place: true
  access_note: Call ahead for after-dark access outside the campground.
  recommended: true
  sources:
  - name: Michigan DNR
    url: https://www.michigan.gov/LakeHudson
  - name: Visit Detroit
    url: https://visitdetroit.com/inside-the-d/top-stargazing-spots/
  - name: Visit Lenawee
    url: https://www.visitlenawee.com/dark-sky-preserve-at-lake-hudson-state-recreation-area/
- id: e900f28c-ca43-4a6a-bc18-512b1185507e
  label: Port Crescent State Park
  dark_sky_place: true
  access_note: Dark Sky Preserve covers the park north and west of the Pinnebog River. Recreation Passport required; confirm night hours with the DNR.
- id: fcf17d08-940a-44a3-a98f-ec8dbac2056e
  label: Point Pelee National Park
  dark_sky_place: true
  access_note: Canadian dark-sky preserve; border crossing required. After-dark access mainly on special Dark Sky Nights or for registered campers.
  recommended: true
  sources:
  - name: Parks Canada
    url: https://parks.canada.ca/pelee
