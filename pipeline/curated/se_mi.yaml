# Curated facts for SE Michigan spots, keyed by Overture GERS ID (release 2026-09-23.1).
# Find IDs with: python -m darksky_pipeline.probe find --metro se_mi --release <R> --name "<name>"
# Keys: id, label, verified, dark_sky_place, access_note, unavailable, unavailable_reason, hidden
#
# Dark sky designations: Michigan Public Act 57 of 1993 (Lake Hudson) and 2012 amendments
# (Port Crescent, portion north/west of the Pinnebog River). No official source found yet
# for 24h / after-dark access, so nothing is marked verified.
spots:
  - id: a3cdd909-ea67-4bee-876a-2b0534f77960
    label: Lake Hudson State Park
    dark_sky_place: true
    access_note: Michigan Dark Sky Preserve. Recreation Passport required; confirm night hours with the DNR.
  - id: e900f28c-ca43-4a6a-bc18-512b1185507e
    label: Port Crescent State Park
    dark_sky_place: true
    access_note: Dark Sky Preserve covers the park north and west of the Pinnebog River. Recreation Passport required; confirm night hours with the DNR.
